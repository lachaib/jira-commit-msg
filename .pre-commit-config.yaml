---
default_install_hook_types:
  - pre-commit
  - prepare-commit-msg
  - post-checkout
  - post-merge
default_stages:
  - pre-commit

default_language_version:
  python: python3.15

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v4.3.0"
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
        exclude: .vscode
      - id: trailing-whitespace
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
        exclude: .vscode
      - id: check-symlinks
      - id: check-shebang-scripts-are-executable
      - id: forbid-new-submodules
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version synced with uv.lock via sync-with-uv
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.91
    hooks:
      - id: ty

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.26
    hooks:
      - id: uv-lock
      - id: uv-sync

  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.5.0
    hooks:
      - id: sync-with-uv

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: uv run pytest
        args: ["--cov"]
        language: system
        pass_filenames: false
        always_run: true
