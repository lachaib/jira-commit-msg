name: Dependency review
on:
  pull_request:
    branches:
      - master

jobs:
  lock-delta:
    name: Compute and report dependency updates
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Compute and report dependency updates
        id: lockdelta
        uses: lachaib/lockdelta@v0.1
        with:
          post-comment: if-changed
        env:
          GITHUB_TOKEN: ${{github.token}}
      - name: Scan for sensitive dependency updates
        uses: lachaib/lockscan@v0.1
        with:
          lockdelta-output: ${{ steps.lockdelta.outputs.diff }}
          only: added,updated
          post-comment: if-findings
          fail-on: critical
